plugins {
    id 'multiloader-loader'
}

loom {
    // Automatically convert AccessWideners to AccessTransformers if the file exists
    def awFile = project(':common').file("src/main/resources/${project.mod_id}.classtweaker")
    if (awFile.exists()) {
        convertAw2At(tasks.named('jar', Jar), ["${project.mod_id}.classtweaker"])
    }

    runs {
        clientData {
            client()
            runtimeEnvironment.set('clientData')
            programArguments.addAll(['--all', '--mod', "${project.mod_id}"])
            programArguments.addAll(['--output', project(':common').file('src/main/generated').absolutePath])
            programArguments.addAll(['--existing', project(':common').file('src/main/resources').absolutePath])
        }
    }
}

repositories {
    maven {
        name = 'NeoForge'
        url = 'https://maven.neoforged.net/releases/'
    }
}

dependencies {
    forgeUserdev "net.neoforged:neoforge:${project.neoforge_version}:userdev"
}