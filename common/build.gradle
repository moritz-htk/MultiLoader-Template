plugins {
    id 'multiloader-common'
}

loom {
    // Automatically enable AccessWideners if the file exists
    def aw = file("src/main/resources/${project.mod_id}.classtweaker")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

// Include resources generated by data generators.
sourceSets.main.resources.srcDir file('src/main/generated')

dependencies {}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.files
}